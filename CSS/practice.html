<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semantic Layout</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:black;
    color:white;
    font-family:Arial, sans-serif;
}

main{
    width:900px;
    height:600px;
    border:3px dotted white;
    background:black;
    display:grid;
    grid-template-rows:80px 1fr 80px;
}

/* Header */
header{
    display:grid;
    grid-template-columns:1fr 1fr;
    border-bottom:3px dotted white;
}

header div{
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    font-weight:bold;
    border-right:3px dotted white;
}

header div:last-child{
    border-right:none;
}

/* Middle Section */
section{
    display:grid;
    grid-template-columns:1fr 1fr;
}

article{
    position:relative;
    border-right:3px dotted white;
    padding:20px;
}

article:last-child{
    border-right:none;
}

h2{
    font-size:24px;
}

/* Small Square Box */
.small-box{
    width:150px;
    height:150px;
    border:3px dotted white;
    background:blue;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* Footer */
footer{
    display:grid;
    grid-template-columns:1fr 1fr;
    border-top:3px dotted white;
}

footer div{
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    font-weight:bold;
    border-right:3px dotted white;
}

footer div:last-child{
    border-right:none;
}
</style>

</head>
<body>

<main>

    <header>
        <div>Logo</div>
        <div>Links</div>
    </header>

    <section>

        <article>
            <h2>Logo</h2>

            <div class="small-box">
                Small<br>Square Box
            </div>
        </article>

        <article>
            <h2>Links</h2>

            <div class="small-box">
                Small<br>Square Box
            </div>
        </article>

    </section>

    <footer>
        <div>Footer 1</div>
        <div>Footer 2</div>
    </footer>

</main>

</body>
</html>
