<!DOCTYPE html>
<html>
<head>
<style>
.container{
    position:relative;
    width:500px;
    height:400px;
}

.y{
    position:absolute;
    left:50px;
    top:50px;
    width:3px;
    height:300px;
    background:black;
}

.x{
    position:absolute;
    left:50px;
    top:350px;
    width:400px;
    height:3px;
    background:black;
}

.fixed{
    position:absolute;
    left:250px;
    top:200px;
    width:120px;
    height:3px;
    background:black;
    transform:rotate(30deg);
    transform-origin:left center;
}

.rotate{
    position:absolute;
    left:250px;
    top:200px;
    width:120px;
    height:3px;
    background:black;
    transform-origin:left center;
    animation:spin 4s linear infinite;
}

@keyframes spin{
    from{
        transform:rotate(-30deg);
    }
    to{
        transform:rotate(330deg);
    }
}
</style>
</head>
<body>

<div class="container">
    <div class="y"></div>
    <div class="x"></div>
    <div class="fixed"></div>
    <div class="rotate"></div>
</div>

</body>
</html>
