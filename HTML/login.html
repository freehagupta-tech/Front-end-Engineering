<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="Author" content="Freeha Gupta"/>
    <meta name="Description" content="Create Login Form"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="login.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courgette&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    </style>
</head>
<body>
    <section>
        <main>
          <form action="https://www.google.com/" method="get">
            <h2 style="text-align: center">Login</h2>
            <label for="email">Email</label><br>
            <input
              type="text"
              id="email"
              name="email"
              placeholder="Enter your email"
              minlength="3"
              maxlength="50"
              required
            >
            <br /><br/>  
            <label for="password">Password</label><br>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    minlength="8"
                    maxlength="20"
                    required
                >

                <br><br>

            <button type="submit">Submit</button>
          </form>
        </main>
    </section>
</body>
</html>
