<!DOCTYPE html>
<html>
<head>
<style>
body{
    margin:0;
    background:blue;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    height:100vh;
}

.box{
    width:90%;
    height:50%;
    background:white;
    margin-top:30px;
    display:flex;
    justify-content:center;
    align-items:center;
}

canvas{
    background:white;
}
</style>
</head>
<body>

<div class="box">
    <canvas id="canvas" width="700" height="350"></canvas>
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

ctx.strokeStyle = "black";
ctx.lineWidth = 2;

const r = 100;       // Radius
const y = 175;

// Centers are exactly one radius apart
const x1 = 180;
const x2 = x1 + r;
const x3 = x2 + r;

// Left Circle
ctx.beginPath();
ctx.arc(x1, y, r, 0, 2 * Math.PI);
ctx.stroke();

// Middle Circle
ctx.beginPath();
ctx.arc(x2, y, r, 0, 2 * Math.PI);
ctx.stroke();

// Right Circle
ctx.beginPath();
ctx.arc(x3, y, r, 0, 2 * Math.PI);
ctx.stroke();

</script>

</body>
</html>
