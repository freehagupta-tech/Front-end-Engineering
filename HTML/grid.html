<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Freeha Gupta">
    <title>Flex Box</title>
    <style>
        * {
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body{
            min-height:100dvh;
            font-family:"Courgette", sans-serif;
            font-size:16px;
            background-color:white;
            color:white;
        }
        .box{
            background-color:darkred;
            color:white;
            padding:1rem;
        }
        .gc{
            display:grid;
            gap:0.5rem;
            grid-template-columns:150px 250px;
            grid-template-rows:repeat(3,150px);
            place-content:center;
        }
    </style>
</head>
<body>
    <section class="box" style="height: 10vh">Header/NavBar
    <span style="font-size:2.5rem;margin-right:1rem;"></span></section>
    <section
      class="box gc"
      style="height:80vh; background-color:white"
    >
    <main class="box" id="m1">Content-1</main>
    <main class="box" id="m2">Content-2</main>
    <main class="box" id="m3">Content-3</main>
    <main class="box" id="m4">Content-3</main>
    <main class="box" id="m5">Content-3</main>
    <main class="box" id="m6">Content-3</main>
    </section>
    <section
      class="box"
      style="position:absolute; bottom:0; left:0; height:10vh; width:100%;"
    >
      Footer
</section>
    
</body>
</html>
